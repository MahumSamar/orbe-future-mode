:root{
  --ink:#f3f6ff;
  --cyan:#5ef3ff;
  --bezel:#030409;
  --mono:"Orbe Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0f3a;overflow:hidden}
body{color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}

/* ---------- stages: a stage is a box; its .frame is the 2048x1360 mockup frame, cover-fitted ---------- */
.stage{position:absolute;inset:0;container-type:size;overflow:hidden}
.frame{position:absolute;left:50%;top:50%;
  --u:max(100cqw / 2048, 100cqh / 1360);
  width:calc(2048 * var(--u));height:calc(1360 * var(--u));transform:translate(-50%,-50%)}
.frame>*{position:absolute}
/* text layers are pinned to the viewport (never cropped): headline to the top, words + button to the bottom.
   Unit: the mockup frame scaled to fit inside the viewport (equals the cover unit at 3:2). */
.frame.pin{left:0;top:0;width:100%;height:100%;transform:none;--u:min(100vw / 2048, 100vh / 1150)}
.plate{inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fig{inset:0;width:100%;height:100%;display:block}
.sky{left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}   /* decoded only as a WebGL texture */
.skygl{inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1s ease}
.skygl.on{opacity:1}
.fig3d{inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.4s ease}
.fig3d.on{opacity:1}
.fig.gone{opacity:0 !important;transition:opacity 1.4s ease}

/* headline marquee (sits under the figure) */
.hl{left:0;top:calc(100 * var(--u));width:calc(8000 * var(--u));height:calc(260 * var(--u));overflow:visible}
.hl svg{width:100%;height:100%;display:block;overflow:visible}
.track{animation:marquee 34s linear infinite}
@keyframes marquee{to{transform:translateX(-2352px)}}
.lbl{font-family:var(--mono);font-size:24px;fill:var(--ink)}

/* UI that sits over the figure */
.copy{top:calc(50% - 101 * var(--u));font-size:calc(21.4 * var(--u));line-height:calc(30 * var(--u));letter-spacing:0;text-transform:uppercase}
.copy p{white-space:pre}
.copy .gap{height:calc(21 * var(--u))}
.copy .pl{letter-spacing:.24em;margin-right:-.24em;position:relative;top:calc(-5 * var(--u))}
.copy-r .pl{margin-right:0}
.copy-l{left:calc(102 * var(--u))}
.copy-r{right:calc(95 * var(--u));text-align:right}
.word{display:block;overflow:visible}
.w-new{left:calc(60 * var(--u));bottom:calc(120 * var(--u));width:calc(480 * var(--u));height:calc(160 * var(--u))}
.w-era{right:calc(48 * var(--u));bottom:calc(120 * var(--u));width:calc(420 * var(--u));height:calc(160 * var(--u))}

.btn{left:calc(50% - 162 * var(--u));bottom:calc(131 * var(--u));width:calc(330 * var(--u));height:calc(102 * var(--u));
  border:0;background:none;color:var(--ink);cursor:pointer;font:inherit;padding:0}
.btn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.btn .label{position:absolute;left:calc(62 * var(--u));top:50%;transform:translateY(-50%);font-size:calc(26.3 * var(--u));letter-spacing:.01em}
.btn .chip{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.btn .chev{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.btn:hover .chip{transform:translateX(-6px) scaleX(1.07);transform-origin:1180px 1175px}
.btn:hover .chev{transform:translateX(8px)}
.btn:hover .label{color:#fff;text-shadow:0 0 calc(10*var(--u)) rgba(94,243,255,.6)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}

/* ---------- HUD (pinned to the viewport edges, its own unit) ---------- */
.hud{position:fixed;inset:0;pointer-events:none;--h:min(100vw / 2048, 100vh / 1360);z-index:10}
.hud svg.bezel{position:absolute;inset:0;width:100%;height:100%}
.hud .t{position:absolute;font-size:calc(23 * var(--h));line-height:1;white-space:pre;color:var(--ink)}
.hud .top{left:50%;top:calc(14 * var(--h));transform:translateX(calc(-50% - 6 * var(--h)))}
.hud .coords{left:50%;bottom:calc(27 * var(--h));transform:translateX(-50%);font-size:calc(21.3 * var(--h))}
.hud .menu{right:calc(41 * var(--h));top:calc(42 * var(--h));pointer-events:auto;background:none;border:0;color:inherit;font:inherit;font-size:calc(23 * var(--h));cursor:pointer}
.hud .on{left:calc(45 * var(--h));top:calc(40 * var(--h));pointer-events:auto;background:none;border:0;color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;gap:calc(8 * var(--h))}
.hud .on svg{width:calc(68 * var(--h));height:calc(22 * var(--h));display:block}
.hud .on span{font-size:calc(23 * var(--h))}
.hud .menu:hover,.hud .on:hover span{color:var(--cyan)}

/* entrance guard */
.js .enter{opacity:0}
.js.entered .enter{opacity:1}

/* ---------- phone ---------- */
@media (max-width:820px){
  .hud{--h:calc(100vw / 860)}
  .hud .bulge{display:none}
  .stage-fig{top:clamp(200px,30svh,260px)}
  .stage-ui,.stage-hl{container-type:normal}
  .stage-ui .frame,.stage-hl .frame{position:absolute;inset:0;width:auto;height:auto;transform:none;--u:calc(100vw / 1100)}
  .hl{left:0;top:58px;width:calc(8000 * 120px / 260);height:120px}
  .copy{top:186px;font-size:11px;line-height:14px}
  .copy .gap{height:8px}
  .copy-l{left:20px}

/* ---------- sky: Kling loop drawn in WebGL with a cursor "liquid glass" trail ----------

    cur.ry += (ty - cur.ry) * k; cur.rx += (tx - cur.rx) * k; cur.rz += (tz - cur.rz) * k;
    cur.px += (ptr.dx * 14 - cur.px) * k;                     // small parallax drift
    glow.forEach(u => u.uTime.value = t);
    pivot.rotation.set(cur.rx, cur.ry, cur.rz);
    pivot.position.set(base.x + cur.px, base.y + Math.sin(t * .9) * 5, 0);
    renderer.render(scene, cam);
  }

  new GLTFLoader().load(GLB, g => {
    const m = g.scene;
    m.rotation.y = FIT.yaw; m.updateMatrixWorld(true);
    // frosted iridescent glass: keep the sculpt's colour + normal maps, swap the shading
    m.traverse(o => {
      if (!o.isMesh) return;
      const old = o.material;
      o.material = new THREE.MeshPhysicalMaterial({
        map: old.map, normalMap: old.normalMap, normalScale: new THREE.Vector2(1, 1),
        color: 0xa9b2ff, roughness: .25, metalness: 0,
        clearcoat: 1, clearcoatRoughness: .08,
        iridescence: 1, iridescenceIOR: 1.4, iridescenceThicknessRange: [200, 700],
        sheen: .5, sheenRoughness: .3, sheenColor: new THREE.Color(0x9fe9ff),
        emissive: new THREE.Color(0x30227a), emissiveIntensity: .5,
        envMapIntensity: .7, transparent: true, opacity: .88
      });
      old.dispose();
      // glass glow (geometry space): fresnel rim cyan->violet, peach inner glow in the chest,
      // and the halo ring (top ~29% of the sculpt) lit cyan with a slow pulse
      o.geometry.computeBoundingBox();
      const gb = o.geometry.boundingBox, gh = gb.max.y - gb.min.y;
      const U = {uMinY: {value: gb.min.y}, uH: {value: gh}, uTime: {value: 0}};
      glow.push(U);
      o.material.onBeforeCompile = sh => {
        Object.assign(sh.uniforms, U);
        sh.vertexShader = 'varying vec3 vObj;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vObj = position;');
        sh.fragmentShader = 'varying vec3 vObj; uniform float uMinY, uH, uTime;\n#define RING vec4(-.035, .328, .152, .112)\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
          // Tripo closes the halo ring with a membrane: cut it out (ring lies in the model's Y-Z plane),
          // keeping the planet and the small moon inside it
          vec2 rq = vec2((vObj.z - RING.x) / RING.z, (vObj.y - RING.y) / RING.w);
          float inDisc = dot(rq, rq);
          float onPlanet = step(length(vObj.zy - vec2(-.031, .339)), .046) + step(length(vObj.zy - vec2(-.112, .294)), .02);
          if (inDisc < 1.0 && onPlanet < .5) discard;
          float yf = (vObj.y - uMinY) / uH;                       // 0 = bottom, 1 = top of the ring
          float facing = clamp(abs(normal.z), 0.0, 1.0);
          float rim = pow(1.0 - facing, 2.0);
          vec3 rimCol = mix(vec3(.35,.95,1.0), vec3(.66,.4,1.0), smoothstep(.2, .8, yf));
          totalEmissiveRadiance += rimCol * rim * 1.8;
          float core = smoothstep(.18, .42, yf) * (1.0 - smoothstep(.52, .68, yf)) * pow(facing, 2.5);
          totalEmissiveRadiance += vec3(1.0, .62, .55) * core * .55;
          float ring = smoothstep(.69, .73, yf);
          diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(.08, .62, 1.0), ring * (1.0 - onPlanet * .6));
          float pulse = .85 + .15 * sin(uTime * 2.2);
          totalEmissiveRadiance += vec3(.06,.7,1.0) * ring * (.9 + 2.2 * rim) * pulse * (1.0 - onPlanet * .5);`);
      };
    });
    const box = new THREE.Box3().setFromObject(m), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    m.position.sub(c);                                      // centre the model on the pivot
    const k = (BOX.y1 - BOX.y0) / size.y * FIT.s;
    pivot.scale.setScalar(k);
    base.x = (BOX.x0 + BOX.x1) / 2 + FIT.dx;
    base.y = -(BOX.y0 + BOX.y1) / 2 + FIT.dy;
    pivot.position.set(base.x, base.y, 0);
    pivot.add(m);
    fit(); renderer.render(scene, cam);
    canvas.classList.add('on'); flat && flat.classList.add('gone');
    // free the placeholder's GL context once the crossfade is done (two contexts left: sky + figure)
    setTimeout(() => { const g = flat && flat.getContext('webgl'); const x = g && g.getExtension('WEBGL_lose_context'); x && x.loseContext(); }, 2000);
    ready = true;
    window.__fig3d = {size:[size.x, size.y, size.z], k}; window.__three = {renderer, scene, cam, pivot, step: n => frame(n)};
    if (!reduce) raf = requestAnimationFrame(frame);
  }, undefined, err => { console.warn('3D figure failed to load; keeping the still', err); });

  addEventListener('resize', () => { fit(); if (ready) renderer.render(scene, cam); });
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(raf); canvas.classList.remove('on'); });
  fit();
}
</script>
</body>
</html>
